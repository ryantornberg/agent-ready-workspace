name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:
          - os: ubuntu-latest   # the hosted Ubuntu image no longer offers Python 3.9
            python: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the freshness check compares with the commit before the push
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -b tests
      - run: python ws.py selftest
      # A teammate who never installed the commit hook is caught here: a page edited
      # in this push or pull request, and past its review date, fails.
      - run: python ws.py check --changed-from "${{ github.event.pull_request.base.sha || github.event.before }}"
